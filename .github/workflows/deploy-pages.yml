name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish to the live Pages site
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out build tools from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: build-tools

      - name: Check out selected branch source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: branch-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-tools/package-lock.json

      - name: Install build dependencies
        working-directory: build-tools
        run: npm ci

      - name: Build optimized site
        working-directory: build-tools
        env:
          SITE_SOURCE_DIR: ../branch-source/src
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-tools/.pages-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
